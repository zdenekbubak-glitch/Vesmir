name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Every Wednesday at 00:05 Czech local time, including DST changes.
    - cron: "5 0 * * 3"
      timezone: "Europe/Prague"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate SEO pages
        run: |
          python3 tools/build_static.py --site-dir . --out . --base https://kosmonovinky.cz
          python3 tools/build_explainery.py --site-dir . --out . --base https://kosmonovinky.cz


      - name: Restore IndexNow history
        id: indexnow-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-v1-

      - name: Prepare IndexNow changes
        id: indexnow-prepare
        continue-on-error: true
        run: python3 scripts/submit_indexnow.py prepare --state "${{ runner.temp }}/indexnow-state.json" --plan "${{ runner.temp }}/indexnow-plan.json"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1800000'

      - name: Notify IndexNow after deployment
        id: indexnow-submit
        if: ${{ success() && steps.indexnow-prepare.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/submit_indexnow.py submit --state "${{ runner.temp }}/indexnow-state.json" --plan "${{ runner.temp }}/indexnow-plan.json"

      - name: Save IndexNow history
        if: ${{ success() && steps.indexnow-submit.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}

