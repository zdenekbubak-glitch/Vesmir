name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Every Wednesday at 00:05 Czech local time, including DST changes.
    - cron: "5 0 * * 3"
      timezone: "Europe/Prague"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate SEO pages
        run: |
          python3 tools/build_static.py --site-dir . --out . --base https://kosmonovinky.cz
          python3 tools/build_explainery.py --site-dir . --out . --base https://kosmonovinky.cz


      - name: Restore IndexNow history
        id: indexnow-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-v1-

      - name: Prepare IndexNow changes
        id: indexnow-prepare
        continue-on-error: true
        run: python3 scripts/submit_indexnow.py prepare --state "${{ runner.temp }}/indexnow-state.json" --plan "${{ runner.temp }}/indexnow-plan.json"

      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '.'

      - name: Wait for Pages artifact metadata
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          artifact_id = os.environ["PAGES_ARTIFACT_ID"]
          if not artifact_id.isdecimal():
              raise SystemExit("Upload artifact did not return a valid artifact ID.")

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          expected_name = os.environ["PAGES_ARTIFACT_NAME"]
          request = Request(
              f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?name={expected_name}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              },
          )

          for attempt in range(1, 7):
              # Allow time for a newly finalized upload to appear in the artifact listing.
              time.sleep(5)
              try:
                  with urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)["artifacts"]
              except HTTPError as exc:
                  if exc.code not in (404, 429, 500, 502, 503, 504):
                      raise
                  print(f"Artifact lookup returned HTTP {exc.code} ({attempt}/6).")
                  continue
              except (URLError, TimeoutError) as exc:
                  print(f"Artifact lookup temporarily failed ({attempt}/6): {exc}")
                  continue

              if any(
                  str(item["id"]) == artifact_id
                  and item["name"] == expected_name
                  and not item["expired"]
                  for item in artifacts
              ):
                  print(f"Pages artifact {expected_name} is listed.")
                  break
              print(f"Waiting for Pages artifact {expected_name} ({attempt}/6).")
          else:
              raise SystemExit(f"Pages artifact {expected_name} did not appear in the run.")
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1800000'
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Notify IndexNow after deployment
        id: indexnow-submit
        if: ${{ success() && steps.indexnow-prepare.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/submit_indexnow.py submit --state "${{ runner.temp }}/indexnow-state.json" --plan "${{ runner.temp }}/indexnow-plan.json"

      - name: Save IndexNow history
        if: ${{ success() && steps.indexnow-submit.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
