name: Zkouška kontroly překladu
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Porovnat texty a změřit tokeny
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/test_translation_control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-control-report
          path: translation-control-report.json
