name: Quote X posts (kosmologie)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quote-x-posts
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Search and prepare quotes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/quote_x_posts.py

      - name: Uložit stav použitých příspěvků
        if: ${{ always() }}
        run: python scripts/save_quote_state.py

      - name: Uložit výsledky odeslání pro statistiky
        if: ${{ always() }}
        run: python scripts/save_social_posts.py
