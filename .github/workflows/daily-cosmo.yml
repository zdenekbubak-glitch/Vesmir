name: Denní kosmologické novinky

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Prague'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait before arXiv (reduce 429)
        run: sleep 30

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_and_update.py

      - name: Generate X card
        run: python scripts/generate_x_card.py
      
      - name: Fetch gallery images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python scripts/fetch_images.py

      - name: Commit and push
        run: |
          git config user.name "cosmo-agent"
          git config user.email "agent@users.noreply.github.com"
          git add data/news.json data/images.json assets/cards/daily.jpg
          if git diff --staged --quiet; then
            echo "Žádné změny – nic necommitám."
          else
            git commit -m "Automatická aktualizace novinek $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            echo "Push OK."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
