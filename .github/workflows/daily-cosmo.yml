name: Denní kosmologické novinky

on:
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait before arXiv (reduce 429)
        run: sleep 30

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/fetch_and_update.py

      - name: Generate X card
        run: python scripts/generate_x_card.py
      
      - name: Fetch gallery images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python scripts/fetch_images.py

      - name: Prepare thematic article images
        run: python3 tools/assign_article_images.py --site-dir .

      - name: Commit and push
        run: |
          git config user.name "cosmo-agent"
          git config user.email "agent@users.noreply.github.com"
          mkdir -p assets/gallery
          git add data/news.json data/images.json data/article_image_assignments.json data/article_image_previews.json assets/cards/daily.jpg assets/gallery assets/article-images
          if git diff --staged --quiet; then
            echo "Žádné změny – nic necommitám."
          else
            git commit -m "Automatická aktualizace novinek $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Push OK."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Změny se nepodařilo zapsat do main."
                exit 1
              fi
              git fetch origin refs/heads/main
              if git merge-base --is-ancestor FETCH_HEAD HEAD; then
                echo "::error::Push selhal, i když main nemá nové změny."
                exit 1
              fi
              echo "Mezitím se změnila větev main. Připojuji denní aktualizaci k její nejnovější verzi."
              if ! git rebase FETCH_HEAD; then
                git rebase --abort
                echo "::error::Denní aktualizace je v konfliktu s novými změnami v main."
                exit 1
              fi
            done
          fi

      - name: Generate SEO pages
        run: |
          python3 tools/build_static.py --site-dir . --out . --base https://kosmonovinky.cz
          python3 tools/build_explainery.py --site-dir . --out . --base https://kosmonovinky.cz

      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Restore IndexNow history
        id: indexnow-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-v1-

      - name: Prepare IndexNow changes
        id: indexnow-prepare
        continue-on-error: true
        run: python3 scripts/submit_indexnow.py prepare --state "${{ runner.temp }}/indexnow-state.json" --plan "${{ runner.temp }}/indexnow-plan.json"

      - name: Identify current Pages content
        id: pages-content
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          marker = {"run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "news_sha256": hashlib.sha256(Path("data/news.json").read_bytes()).hexdigest()}
          Path("pages-content-check.json").write_text(json.dumps(marker), encoding="utf-8")
          PY

      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '.'

      - name: Wait for Pages artifact metadata
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          artifact_id = os.environ["PAGES_ARTIFACT_ID"]
          if not artifact_id.isdecimal():
              raise SystemExit("Upload artifact did not return a valid artifact ID.")

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          expected_name = os.environ["PAGES_ARTIFACT_NAME"]
          request = Request(
              f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?name={expected_name}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              },
          )

          for attempt in range(1, 7):
              # Allow time for a newly finalized upload to appear in the artifact listing.
              time.sleep(5)
              try:
                  with urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)["artifacts"]
              except HTTPError as exc:
                  if exc.code not in (404, 429, 500, 502, 503, 504):
                      raise
                  print(f"Artifact lookup returned HTTP {exc.code} ({attempt}/6).")
                  continue
              except (URLError, TimeoutError) as exc:
                  print(f"Artifact lookup temporarily failed ({attempt}/6): {exc}")
                  continue

              if any(
                  str(item["id"]) == artifact_id
                  and item["name"] == expected_name
                  and not item["expired"]
                  for item in artifacts
              ):
                  print(f"Pages artifact {expected_name} is listed.")
                  break
              print(f"Waiting for Pages artifact {expected_name} ({attempt}/6).")
          else:
              raise SystemExit(f"Pages artifact {expected_name} did not appear in the run.")
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ steps.pages-content.outputs.sha }}
        with:
          timeout: '600000'
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify live Pages content
        timeout-minutes: 4
        run: |
          python3 - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          expected = json.loads(Path("pages-content-check.json").read_text())
          base = "https://kosmonovinky.cz/"
          def read(path, attempt):
              req = Request(base + path + "?pages_check=" + expected["run"] + "-" + expected["attempt"] + "-" + str(attempt),
                            headers={"Cache-Control": "no-cache"})
              with urlopen(req, timeout=12) as response:
                  return response.read()
          for attempt in range(1, 7):
              try:
                  marker = json.loads(read("pages-content-check.json", attempt))
                  if marker != expected:
                      raise ValueError("Web vrací jinou verzi nasazení.")
                  if hashlib.sha256(read("data/news.json", attempt)).hexdigest() != expected["news_sha256"]:
                      raise ValueError("Živý news.json neodpovídá nasazenému souboru.")
                  print("Živá verze i obsah news.json ověřeny.")
                  break
              except Exception as exc:
                  print(f"Ověření {attempt}/6: {type(exc).__name__}: {exc}")
                  if attempt == 6:
                      raise SystemExit("Publikování nebylo potvrzeno; příspěvky na sociální sítě se neodesílají.")
                  time.sleep(10)
          PY

      - name: Navrhnout překlady do slovníčku
        continue-on-error: true
        timeout-minutes: 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/glossary_issues.py propose

      - name: Post daily card to X via Buffer
        id: daily-x
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          export CARD_SHA=$(git rev-parse HEAD)
          python3 << 'EOF'
          import json, os, datetime, requests, time, hashlib, io
          from PIL import Image
          from scripts.social_tracking import post_key, tracked_url, receipt, article_url
          from scripts.generate_x_card import pick_item
          from pathlib import Path

          news_path = Path("data/news.json")
          if not news_path.exists():
              print("news.json nenalezen")
              exit(0)

          items = json.loads(news_path.read_text())
          today = datetime.date.today().isoformat()
          today_items = [i for i in items if (i.get("inserted_at") or "")[:10] == today]
          if not today_items:
              print("Dnes žádná nová položka – kartu neposílám.")
              exit(0)

          # Stejný výběr jako na obrázku denní karty.
          item = pick_item(today_items)
          if not item:
              print("Žádný článek pro denní kartu.")
              exit(0)
          api_key = os.environ.get("BUFFER_API_KEY")
          if not api_key:
              raise SystemExit("Chybí BUFFER_API_KEY.")
          target_url = article_url(item, items)
          title = (item.get("title") or "").strip()
          summary = (item.get("summary") or "").strip()
          if "Proč je to zajímavé:" in summary:
              summary = summary.split("Proč je to zajímavé:")[0].strip()
          # Zkrať souhrn na rozumnou délku pro tweet
          if len(summary) > 180:
              summary = summary[:177].rsplit(" ", 1)[0] + "…"

          main_text = f"{title}\n\n{summary}" if summary else title
          # Ověř více veřejných zdrojů proti přesným bajtům dnešní karty.
          card_sha = os.environ["CARD_SHA"]
          card_urls = [
              f"https://kosmonovinky.cz/assets/cards/daily.jpg?v={card_sha}",
              f"https://raw.githubusercontent.com/zdenekbubak-glitch/Vesmir/{card_sha}/assets/cards/daily.jpg",
              f"https://cdn.jsdelivr.net/gh/zdenekbubak-glitch/Vesmir@{card_sha}/assets/cards/daily.jpg",
          ]
          expected = hashlib.sha256(Path("assets/cards/daily.jpg").read_bytes()).digest()
          card_url = None
          for attempt in range(1, 4):
              for candidate in card_urls:
                  try:
                      media = requests.get(candidate, timeout=15)
                      media.raise_for_status()
                      Image.open(io.BytesIO(media.content)).verify()
                      if hashlib.sha256(media.content).digest() != expected:
                          raise ValueError("Zdroj ještě nevrací aktuální kartu.")
                      card_url = candidate
                      print(f"Karta dostupná a ověřená: {card_url}")
                      break
                  except (requests.RequestException, OSError, ValueError) as exc:
                      print(f"Zdroj karty nedostupný ({attempt}/3): {candidate}: {exc}")
              if card_url:
                  break
              if attempt < 3:
                  time.sleep(10)
          if not card_url:
              raise RuntimeError("Aktuální karta není dostupná na žádném ze tří zdrojů.")


          mutation = """
          mutation CreateThread($input: CreatePostInput!) {
            createPost(input: $input) {
              ... on PostActionSuccess { 
                post { 
                  id 
                  status 
                  assets { id mimeType source }
                } 
              }
              ... on MutationError { message }
            }
          }
          """
          variables = {
            "input": {
              "channelId": "6acb6eaa778b240e2fd5fb5d",
              "schedulingType": "automatic",
              "mode": "shareNow",
              "text": main_text,
              "assets": [{
                "image": {
                  "url": card_url
                }
              }],
              "metadata": {
                "twitter": {
                  "thread": [
                                        {
                      "text": main_text,
                      "assets": [{"image": {"url": card_url}}]
                    },
                    {"text": tracked_url(target_url, "x", "daily", post_key("x", "daily", today))}
                  ]
                }
              }
            }
          }
          headers = {
            "Authorization": f"Bearer {api_key}",
            "Content-Type": "application/json"
          }
          r = requests.post("https://api.buffer.com", json={"query": mutation, "variables": variables}, headers=headers, timeout=30)
          print(f"Buffer HTTP {r.status_code}")
          print(f"Buffer odpověď: {r.text[:1000]}")
          r.raise_for_status()
          data = r.json()
          if data.get("errors"):
              raise RuntimeError(f"Buffer GraphQL chyba: {data['errors']}")
          result = (data.get("data") or {}).get("createPost") or {}
          if "message" in result:
              raise RuntimeError(f"Buffer chyba: {result['message']}")
          post = result.get("post") or {}
          post_id = post.get("id")
          status = (post.get("status") or "").lower()
          if not post_id:
              raise RuntimeError("Buffer nevrátil ID příspěvku.")
          receipt("x", "daily", post_key("x","daily",today), title, post_id, post.get("status"), target=target_url)
          if status in {"error", "failed"}:
              raise RuntimeError(f"X příspěvek {post_id} má stav {status}. Zkontroluj Buffer a použij Retry Now; celý workflow neopakuj.")
          if status == "sent":
              print(f"X příspěvek odeslán: {post_id}")
          else:
              print(f"Buffer přijal příspěvek {post_id}; stav {status or 'neuveden'} ještě nepotvrzuje zveřejnění.")
          EOF

      - name: Notify IndexNow after deployment
        id: indexnow-submit
        if: ${{ success() && steps.indexnow-prepare.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/submit_indexnow.py submit --state "${{ runner.temp }}/indexnow-state.json" --plan "${{ runner.temp }}/indexnow-plan.json"

      - name: Save IndexNow history
        if: ${{ success() && steps.indexnow-submit.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Post daily link to Facebook via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, os, datetime, requests
          from scripts.social_tracking import post_key, tracked_url, receipt, article_url, pick_daily_link_item
          from pathlib import Path

          news_path = Path("data/news.json")
          if not news_path.exists():
              print("news.json nenalezen")
              exit(0)

          items = json.loads(news_path.read_text())
          today = datetime.date.today().isoformat()
          item = pick_daily_link_item(items, today)
          if not item:
              print("Facebook: dnes není způsobilý český článek.")
              exit(0)
          source = "článek z karty X" if item.get("daily_card_selected") else "první způsobilý český článek"
          print(f"Facebook: {source} – {item['title']}")
          api_key = os.environ.get("BUFFER_API_KEY")
          if not api_key:
              raise SystemExit("Chybí BUFFER_API_KEY.")
          target_url = article_url(item, items)
          title = (item.get("title") or "").strip()
          summary = (item.get("summary") or "").strip()
          if "Proč je to zajímavé:" in summary:
              summary = summary.split("Proč je to zajímavé:")[0].strip()
          # Zkrať souhrn na rozumnou délku pro tweet
          if len(summary) > 180:
              summary = summary[:177].rsplit(" ", 1)[0] + "…"

          main_text = summary or title
          link = tracked_url(target_url, "facebook", "daily", post_key("facebook", "daily", today))

          mutation = """
          mutation CreateThread($input: CreatePostInput!) {
            createPost(input: $input) {
              ... on PostActionSuccess { 
                post { 
                  id 
                  status 
                  assets { id mimeType source }
                } 
              }
              ... on MutationError { message }
            }
          }
          """
          variables = {
            "input": {
              "channelId": "6ad13365778b240e2f1e1c2b",
              "schedulingType": "automatic",
              "mode": "shareNow",
              "text": main_text,
              "assets": [],
              "metadata": {
                "facebook": {"type": "post", "linkAttachment": {"url": link}}
              }
            }
          }
          headers = {
            "Authorization": f"Bearer {api_key}",
            "Content-Type": "application/json"
          }
          r = requests.post("https://api.buffer.com", json={"query": mutation, "variables": variables}, headers=headers, timeout=30)
          print(f"Buffer HTTP {r.status_code}")
          print(f"Buffer odpověď: {r.text[:1000]}")
          r.raise_for_status()
          try:
            data = r.json()
            errors = data.get("errors")
            if errors:
              raise RuntimeError(f"GraphQL errors: {errors}")
            result = data.get("data", {}).get("createPost", {})
            if "message" in result:
              raise RuntimeError(f"Buffer chyba: {result['message']}")
            else:
              post_id = result.get("post", {}).get("id") if result.get("post") else None
              if not post_id:
                  raise RuntimeError("Buffer nevrátil ID příspěvku.")
              receipt("facebook", "daily", post_key("facebook","daily",today), title, post_id, result.get("post", {}).get("status"), target=target_url)
              print(f"Post odeslán: {post_id}")
          except Exception as e:
            raise RuntimeError(f"Odeslání na Facebook selhalo: {e}") from e
          EOF

      - name: Post daily link to Bluesky directly
        env:
          BLUESKY_HANDLE: zdenekbubak.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/post_bluesky.py

      - name: Uložit výsledky odeslání pro statistiky
        if: ${{ always() }}
        run: python scripts/save_social_posts.py

      - name: Report daily X failure
        if: ${{ always() && steps.daily-x.outcome == 'failure' }}
        run: |
          echo "::error::Denní karta na X selhala. Ostatní kroky mohly doběhnout; zkontrolujte krok Post daily card to X via Buffer."
          exit 1


