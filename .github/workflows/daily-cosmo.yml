name: Denní kosmologické novinky

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait before arXiv (reduce 429)
        run: sleep 30

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_and_update.py

      - name: Generate X card
        run: python scripts/generate_x_card.py
      
      - name: Fetch gallery images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python scripts/fetch_images.py

      - name: Prepare thematic article images
        run: python3 tools/assign_article_images.py --site-dir .

      - name: Commit and push
        run: |
          git config user.name "cosmo-agent"
          git config user.email "agent@users.noreply.github.com"
          mkdir -p assets/gallery
          git add data/news.json data/images.json data/article_image_assignments.json data/article_image_previews.json assets/cards/daily.jpg assets/gallery assets/article-images
          if git diff --staged --quiet; then
            echo "Žádné změny – nic necommitám."
          else
            git commit -m "Automatická aktualizace novinek $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            echo "Push OK."
          fi

      - name: Post daily card to X via Buffer
        id: daily-x
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          export CARD_SHA=$(git rev-parse HEAD)
          python3 << 'EOF'
          import json, os, datetime, requests, time, hashlib, io
          from PIL import Image
          from scripts.social_tracking import post_key, tracked_url, receipt, article_url
          from scripts.generate_x_card import pick_item
          from pathlib import Path

          api_key = os.environ.get("BUFFER_API_KEY")
          if not api_key:
              print("Chybí BUFFER_API_KEY")
              raise SystemExit("Chybí BUFFER_API_KEY pro X.")

          news_path = Path("data/news.json")
          if not news_path.exists():
              print("news.json nenalezen")
              exit(0)

          items = json.loads(news_path.read_text())
          today = datetime.date.today().isoformat()
          today_items = [i for i in items if (i.get("inserted_at") or "")[:10] == today]
          if not today_items:
              print("Dnes žádná nová položka – kartu neposílám.")
              exit(0)

          # Stejný výběr jako na obrázku denní karty.
          item = pick_item(today_items)
          target_url = article_url(item, items)
          title = (item.get("title") or "").strip()
          summary = (item.get("summary") or "").strip()
          if "Proč je to zajímavé:" in summary:
              summary = summary.split("Proč je to zajímavé:")[0].strip()
          # Zkrať souhrn na rozumnou délku pro tweet
          if len(summary) > 180:
              summary = summary[:177].rsplit(" ", 1)[0] + "…"

          main_text = f"{title}\n\n{summary}" if summary else title
          # jsDelivr CDN – Buffer spolehlivěji stahuje než raw.githubusercontent.com
          card_url = f"https://cdn.jsdelivr.net/gh/zdenekbubak-glitch/Vesmir@{os.environ.get('CARD_SHA', 'main')}/assets/cards/daily.jpg"
          print(f"Card URL: {card_url}")

          # Čekej na přesné bajty právě vytvořené karty, ne jen HTTP 200.
          expected = hashlib.sha256(Path("assets/cards/daily.jpg").read_bytes()).digest()
          for attempt in range(1, 7):
              try:
                  media = requests.get(card_url, timeout=15)
                  media.raise_for_status()
                  Image.open(io.BytesIO(media.content)).verify()
                  if hashlib.sha256(media.content).digest() != expected:
                      raise ValueError("CDN ještě nevrací aktuální kartu.")
                  print(f"Karta dostupná a ověřená (pokus {attempt}).")
                  break
              except (requests.RequestException, OSError, ValueError) as exc:
                  print(f"Karta zatím nedostupná (pokus {attempt}): {type(exc).__name__}")
                  if attempt == 6:
                      raise RuntimeError("Karta není dostupná; požadavek do Bufferu nebyl odeslán.") from exc
                  time.sleep(10)


          mutation = """
          mutation CreateThread($input: CreatePostInput!) {
            createPost(input: $input) {
              ... on PostActionSuccess { 
                post { 
                  id 
                  status 
                  assets { id mimeType source }
                } 
              }
              ... on MutationError { message }
            }
          }
          """
          variables = {
            "input": {
              "channelId": "6acb6eaa778b240e2fd5fb5d",
              "schedulingType": "automatic",
              "mode": "shareNow",
              "text": main_text,
              "assets": [{
                "image": {
                  "url": card_url
                }
              }],
              "metadata": {
                "twitter": {
                  "thread": [
                                        {
                      "text": main_text,
                      "assets": [{"image": {"url": card_url}}]
                    },
                    {"text": tracked_url(target_url, "x", "daily", post_key("x", "daily", today))}
                  ]
                }
              }
            }
          }
          headers = {
            "Authorization": f"Bearer {api_key}",
            "Content-Type": "application/json"
          }
          r = requests.post("https://api.buffer.com", json={"query": mutation, "variables": variables}, headers=headers, timeout=30)
          print(f"Buffer HTTP {r.status_code}")
          print(f"Buffer odpověď: {r.text[:1000]}")
          r.raise_for_status()
          data = r.json()
          if data.get("errors"):
              raise RuntimeError(f"Buffer GraphQL chyba: {data['errors']}")
          result = (data.get("data") or {}).get("createPost") or {}
          if "message" in result:
              raise RuntimeError(f"Buffer chyba: {result['message']}")
          post = result.get("post") or {}
          post_id = post.get("id")
          status = (post.get("status") or "").lower()
          if not post_id:
              raise RuntimeError("Buffer nevrátil ID příspěvku.")
          receipt("x", "daily", post_key("x","daily",today), title, post_id, post.get("status"), target=target_url)
          if status in {"error", "failed"}:
              raise RuntimeError(f"X příspěvek {post_id} má stav {status}. Zkontroluj Buffer a použij Retry Now; celý workflow neopakuj.")
          if status == "sent":
              print(f"X příspěvek odeslán: {post_id}")
          else:
              print(f"Buffer přijal příspěvek {post_id}; stav {status or 'neuveden'} ještě nepotvrzuje zveřejnění.")
          EOF

      - name: Generate SEO pages
        run: |
          python3 tools/build_static.py --site-dir . --out . --base https://kosmonovinky.cz
          python3 tools/build_explainery.py --site-dir . --out . --base https://kosmonovinky.cz

      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Restore IndexNow history
        id: indexnow-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-v1-

      - name: Prepare IndexNow changes
        id: indexnow-prepare
        continue-on-error: true
        run: python3 scripts/submit_indexnow.py prepare --state "${{ runner.temp }}/indexnow-state.json" --plan "${{ runner.temp }}/indexnow-plan.json"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow after deployment
        id: indexnow-submit
        if: ${{ success() && steps.indexnow-prepare.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/submit_indexnow.py submit --state "${{ runner.temp }}/indexnow-state.json" --plan "${{ runner.temp }}/indexnow-plan.json"

      - name: Save IndexNow history
        if: ${{ success() && steps.indexnow-submit.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Post daily card to Facebook via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          export CARD_SHA=$(git rev-parse HEAD)
          python3 << 'EOF'
          import json, os, datetime, requests
          from scripts.social_tracking import post_key, tracked_url, receipt, article_url
          from scripts.generate_x_card import pick_item
          from pathlib import Path

          api_key = os.environ.get("BUFFER_API_KEY")
          if not api_key:
              print("Chybí BUFFER_API_KEY")
              raise SystemExit("Nelze odeslat příspěvek na Facebook.")

          news_path = Path("data/news.json")
          if not news_path.exists():
              print("news.json nenalezen")
              exit(0)

          items = json.loads(news_path.read_text())
          today = datetime.date.today().isoformat()
          today_items = [i for i in items if (i.get("inserted_at") or "")[:10] == today]
          if not today_items:
              print("Dnes žádná nová položka – kartu neposílám.")
              exit(0)

          # Stejný výběr jako na obrázku denní karty.
          item = pick_item(today_items)
          target_url = article_url(item, items)
          title = (item.get("title") or "").strip()
          summary = (item.get("summary") or "").strip()
          if "Proč je to zajímavé:" in summary:
              summary = summary.split("Proč je to zajímavé:")[0].strip()
          # Zkrať souhrn na rozumnou délku pro tweet
          if len(summary) > 180:
              summary = summary[:177].rsplit(" ", 1)[0] + "…"

          main_text = f"{title}\n\n{summary}" if summary else title
          # jsDelivr CDN – Buffer spolehlivěji stahuje než raw.githubusercontent.com
          card_url = f"https://cdn.jsdelivr.net/gh/zdenekbubak-glitch/Vesmir@{os.environ.get('CARD_SHA', 'main')}/assets/cards/daily.jpg"
          print(f"Card URL: {card_url}")

          mutation = """
          mutation CreateThread($input: CreatePostInput!) {
            createPost(input: $input) {
              ... on PostActionSuccess { 
                post { 
                  id 
                  status 
                  assets { id mimeType source }
                } 
              }
              ... on MutationError { message }
            }
          }
          """
          variables = {
            "input": {
              "channelId": "6ad13365778b240e2f1e1c2b",
              "schedulingType": "automatic",
              "mode": "shareNow",
              "text": main_text + "\n\n" + tracked_url(target_url, "facebook", "daily", post_key("facebook","daily",today)),
              "assets": [{
                "image": {
                  "url": card_url
                }
              
              }],
              "metadata": {
                "facebook": {"type": "post"}
              }
            }
          }
          headers = {
            "Authorization": f"Bearer {api_key}",
            "Content-Type": "application/json"
          }
          r = requests.post("https://api.buffer.com", json={"query": mutation, "variables": variables}, headers=headers, timeout=30)
          print(f"Buffer HTTP {r.status_code}")
          print(f"Buffer odpověď: {r.text[:1000]}")
          r.raise_for_status()
          try:
            data = r.json()
            errors = data.get("errors")
            if errors:
              raise RuntimeError(f"GraphQL errors: {errors}")
            result = data.get("data", {}).get("createPost", {})
            if "message" in result:
              raise RuntimeError(f"Buffer chyba: {result['message']}")
            else:
              post_id = result.get("post", {}).get("id") if result.get("post") else None
              if not post_id:
                  raise RuntimeError("Buffer nevrátil ID příspěvku.")
              receipt("facebook", "daily", post_key("facebook","daily",today), title, post_id, result.get("post", {}).get("status"), target=target_url)
              print(f"Post odeslán: {post_id}")
          except Exception as e:
            raise RuntimeError(f"Odeslání na Facebook selhalo: {e}") from e
          EOF

      - name: Post daily card to Bluesky directly
        env:
          BLUESKY_HANDLE: zdenekbubak.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/post_bluesky.py

      - name: Uložit výsledky odeslání pro statistiky
        if: ${{ always() }}
        run: python scripts/save_social_posts.py

      - name: Report daily X failure
        if: ${{ always() && steps.daily-x.outcome == 'failure' }}
        run: |
          echo "::error::Denní karta na X selhala. Ostatní kroky mohly doběhnout; zkontrolujte krok Post daily card to X via Buffer."
          exit 1

