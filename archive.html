<!DOCTYPE html>
<html lang="cs">
  <!-- Počítání zobrazení bez cookies a identifikace návštěvníků -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archiv – Kosmologické novinky</title>
  <style>
    :root { 
  --bg: #0b0f19; 
  --card: #151b2d; 
  --text: #e8eef7; 
  --accent: #6ea8fe; 
  --muted: #9aa8c7; 
  --header-bg: linear-gradient(135deg, #0f172a, #1e293b);
}

header {
  background: var(--header-bg);
  padding: 1.8rem 1rem 1.5rem;
  text-align: center;
  border-bottom: 1px solid #1e293b;
}

.logo-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.9rem;
  margin-bottom: 0.6rem;
}

.logo-wrapper img {
  height: 48px;
  width: auto;
}

.logo-text h1 {
  margin: 0;
  font-size: 1.7rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.subtitle {
  color: var(--muted);
  font-size: 0.95rem;
  margin: 0.3rem 0 1rem;
}

nav {
  margin: 0.8rem 0 1.2rem;
}

nav a {
  color: var(--accent);
  margin: 0 0.7rem;
  font-size: 0.95rem;
}

/* Email signup */
.signup-box {
  max-width: 420px;
  margin: 0 auto;
  background: rgba(21, 27, 45, 0.7);
  border: 1px solid #1e293b;
  border-radius: 10px;
  padding: 0.9rem 1.1rem;
}

.signup-box p {
  margin: 0 0 0.6rem;
  font-size: 0.9rem;
  color: var(--muted);
}

.signup-form {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  justify-content: center;
}

.signup-form input[type="email"] {
  flex: 1;
  min-width: 200px;
  padding: 0.55rem 0.8rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #0b0f19;
  color: var(--text);
  font-size: 0.95rem;
}

.signup-form button {
  padding: 0.55rem 1.1rem;
  background: var(--accent);
  color: #0b0f19;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.95rem;
}

.signup-form button:hover {
  filter: brightness(1.1);
}

@media (max-width: 500px) {
  .logo-wrapper {
    flex-direction: column;
    gap: 0.5rem;
  }
  .logo-wrapper img {
    height: 42px;
  }
}
  </style>
  <script>
(() => {
  if (
    navigator.webdriver ||
    location.hostname !== "zdenekbubak-glitch.github.io" ||
    !location.pathname.startsWith("/Vesmir/")
  ) return;

  const body = JSON.stringify({
    site: "vesmir",
    id: crypto.randomUUID()
  });

  async function odeslat() {
    try {
      const response = await fetch(
        "https://ai-robotika-radar.zdenek-bubak.chatgpt.site/api/analytics/collect",
        {
          method: "POST",
          mode: "cors",
          credentials: "omit",
          headers: { "Content-Type": "application/json" },
          body,
          keepalive: true
        }
      );
      return response.ok;
    } catch {
      return false;
    }
  }

  odeslat().then(ok => {
    if (!ok) setTimeout(odeslat, 1500);
  });
})();
</script>
</head>
<body>
  <header>
    <h1>Archiv kosmologických novinek</h1>
    <p class="subtitle">Starší příspěvky podle měsíců a let</p>
    <nav>
      <a href="index.html">Aktuální</a>
      <a href="archive.html">Archiv</a>
    </nav>
  </header>

  <main id="content">
    <p class="empty">Načítám archiv…</p>
  </main>

  <footer>
    Data z arXiv + RSS · Aktualizace každý den v 9:00
  </footer>

  <script>
    const MONTH_NAMES = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];

    function getMonthKey(date) {
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
    }

    function monthLabel(key) {
      const [y, m] = key.split('-').map(Number);
      return MONTH_NAMES[m - 1] + ' ' + y;
    }

    async function loadArchive() {
      const content = document.getElementById('content');
      try {
        const res = await fetch('data/news.json?' + Date.now());
        if (!res.ok) throw new Error('Soubor ještě neexistuje');
        const items = await res.json();

        if (!items || items.length === 0) {
          content.innerHTML = '<p class="empty">Archiv je zatím prázdný.</p>';
          return;
        }

        const now = new Date();
        const thisMonth = getMonthKey(now);
        const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const lastMonth = getMonthKey(prev);

        // Do archivu patří vše starší než aktuální + minulý měsíc
        const older = items.filter(item => {
          const d = new Date(item.inserted_at || item.published);
          const key = getMonthKey(d);
          return key !== thisMonth && key !== lastMonth;
        });

        if (older.length === 0) {
          content.innerHTML = `
            <p class="empty">Zatím žádné starší příspěvky. Archiv se začne plnit po uplynutí dvou měsíců.</p>
            <p style="text-align:center"><a href="index.html">← Zpět na aktuální novinky</a></p>`;
          return;
        }

        // Seskupit podle měsíce
        const groups = {};
        older.forEach(item => {
          const d = new Date(item.inserted_at || item.published);
          const key = getMonthKey(d);
          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });

        const orderedKeys = Object.keys(groups).sort().reverse(); // nejnovější nahoře

        // Rozcestník
        const byYear = {};
        orderedKeys.forEach(key => {
          const year = key.split('-')[0];
          if (!byYear[year]) byYear[year] = [];
          byYear[year].push(key);
        });

        let tocHtml = '<div class="toc"><h2>Rozcestník</h2>';
        Object.keys(byYear).sort().reverse().forEach(year => {
          tocHtml += `<div class="toc-year">${year}</div><div class="toc-months">`;
          byYear[year].forEach(key => {
            const count = groups[key].length;
            tocHtml += `<a href="#m-${key}">${monthLabel(key)} (${count})</a>`;
          });
          tocHtml += '</div>';
        });
        tocHtml += '</div>';

        // Obsah
        let bodyHtml = '';
        let currentYear = null;
        orderedKeys.forEach(key => {
          const year = key.split('-')[0];
          if (year !== currentYear) {
            currentYear = year;
            bodyHtml += `<h2 class="year-title">${year}</h2>`;
          }
          bodyHtml += `<h3 class="section-title" id="m-${key}">${monthLabel(key)}</h3>`;
          bodyHtml += groups[key].map(item => renderPost(item)).join('');
        });

        content.innerHTML = tocHtml + bodyHtml + `
          <div class="back-top"><a href="#top">↑ Nahoru</a> · <a href="index.html">← Aktuální novinky</a></div>`;
      } catch (e) {
        content.innerHTML = `<p class="empty">Nepodařilo se načíst data.<br><small>${e.message}</small></p>`;
      }
    }

    function renderPost(item) {
      const inserted = new Date(item.inserted_at).toLocaleString('cs-CZ', { timeZone: 'Europe/Prague' });
      const published = item.published ? new Date(item.published).toLocaleDateString('cs-CZ') : '';
      return `
        <article class="post">
          <h2>${escapeHtml(item.title)}</h2>
          <div class="meta">
            Vloženo: ${inserted} · Zdroj: ${item.source} ${published ? '· Publikováno: ' + published : ''}
          </div>
          <p class="summary">${escapeHtml(item.summary)}</p>
          <a href="${item.url}" target="_blank" rel="noopener">Původní zdroj →</a>
        </article>`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    loadArchive();
  </script>
</body>
</html>
