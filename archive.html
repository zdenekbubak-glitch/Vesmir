<!DOCTYPE html>
<html lang="cs">
  <!-- Počítání zobrazení bez cookies a identifikace návštěvníků -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archiv – Kosmologické novinky</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151b2d;
      --text: #e8eef7;
      --accent: #6ea8fe;
      --muted: #9aa8c7;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.55;
    }
    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      padding: 1.8rem 1rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #1e293b;
    }
    .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .logo-wrapper img {
      height: 80px;
      width: 80px;
      display: block;
      border-radius: 12px;
    }
    .logo-text h1 {
      margin: 0;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0.35rem 0 1rem;
    }
    nav { margin: 0.6rem 0 1.2rem; }
    nav a {
      color: var(--accent);
      margin: 0 0.7rem;
      font-size: 0.95rem;
    }
    .signup-box {
      max-width: 440px;
      margin: 0 auto;
      background: rgba(21, 27, 45, 0.75);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 0.95rem 1.15rem;
    }
    .signup-box p {
      margin: 0 0 0.65rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .signup-form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .signup-form label { display: none; }
    .signup-form input[type="email"] {
      flex: 1;
      min-width: 200px;
      padding: 0.55rem 0.85rem;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0b0f19;
      color: var(--text);
      font-size: 0.95rem;
    }
    .signup-form input[type="email"]::placeholder { color: #64748b; }
    .signup-form input[type="submit"] {
      padding: 0.55rem 1.15rem;
      background: var(--accent);
      color: #0b0f19;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .signup-form input[type="submit"]:hover { filter: brightness(1.12); }
    .signup-form p {
      width: 100%;
      margin: 0.5rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .signup-form p a { color: var(--muted); text-decoration: underline; }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    .filter-bar { display: none; margin: 0 0 1.1rem; }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--card);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 0.35rem 0.45rem 0.35rem 0.85rem;
    }
    .filter-row:focus-within { border-color: var(--accent); }
    .filter-row input[type="search"] {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.45rem 0;
      outline: none;
    }
    .filter-row input[type="search"]::placeholder { color: #64748b; }
    .filter-row input[type="search"]::-webkit-search-cancel-button { display: none; }
    .filter-clear {
      display: none;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.15rem;
      line-height: 1;
      padding: 0.25rem 0.45rem;
      border-radius: 6px;
    }
    .filter-clear:hover { color: var(--text); background: #1e293b; }
    .filter-meta {
      margin: 0.4rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.1em;
    }
    .section-title {
      font-size: 1.15rem;
      color: var(--muted);
      margin: 2rem 0 0.8rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.4rem;
    }
    .year-title {
      font-size: 1.4rem;
      margin: 2.2rem 0 0.6rem;
      color: var(--text);
    }
    .post {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
      margin-bottom: 1.2rem;
      border: 1px solid #1e293b;
    }
    .post h2 { margin: 0 0 0.5rem; font-size: 1.2rem; }
    .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.8rem; }
    .summary { margin: 0 0 0.9rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; }
    footer { text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.85rem; }
    .toc {
      background: var(--card);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1.5rem;
      border: 1px solid #1e293b;
    }
    .toc h2 { margin: 0 0 0.8rem; font-size: 1.1rem; }
    .toc-year { margin: 0.8rem 0 0.3rem; font-weight: 600; }
    .toc-months { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.6rem; }
    .toc-months a {
      display: inline-block;
      padding: 0.3rem 0.7rem;
      background: #1e293b;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .toc-months a:hover { background: #334155; text-decoration: none; }
    .back-top { text-align: center; margin: 2rem 0; }
    @media (max-width: 520px) {
      .logo-wrapper { flex-direction: column; gap: 0.45rem; }
      .logo-wrapper img { height: 64px; width: 64px; }
      .logo-text h1 { font-size: 1.45rem; }
    }
  </style>
  <script>
(() => {
  if (
    navigator.webdriver ||
    location.hostname !== "zdenekbubak-glitch.github.io" ||
    !location.pathname.startsWith("/Vesmir/")
  ) return;

  const body = JSON.stringify({
    site: "vesmir",
    id: crypto.randomUUID()
  });

  async function odeslat() {
    try {
      const response = await fetch(
        "https://ai-robotika-radar.zdenek-bubak.chatgpt.site/api/analytics/collect",
        {
          method: "POST",
          mode: "cors",
          credentials: "omit",
          headers: { "Content-Type": "application/json" },
          body,
          keepalive: true
        }
      );
      return response.ok;
    } catch {
      return false;
    }
  }

  odeslat().then(ok => {
    if (!ok) setTimeout(odeslat, 1500);
  });
})();
</script>
</head>
<body id="top">
  <header>
    <div class="logo-wrapper">
      <img src="assets/logo-icon-square.png" alt="Kosmologické novinky" width="80" height="80">
      <div class="logo-text">
        <h1>Archiv kosmologických novinek</h1>
      </div>
    </div>
    <p class="subtitle">Starší příspěvky podle měsíců a let</p>

    <nav>
      <a href="index.html">← Aktuální novinky</a>
      <a href="archive.html">Archiv</a>
      <a href="images.html">Obrázky</a>
    </nav>
    
    <div class="signup-box">
      <p>Chceš dostávat týdenní přehled novinek emailem?</p>
      <form
        action="https://buttondown.com/api/emails/embed-subscribe/zdenek"
        method="post"
        class="embeddable-buttondown-form signup-form"
      >
        <label for="bd-email">Enter your email</label>
        <input type="email" name="email" id="bd-email" placeholder="tvuj@email.cz" required />
        <input type="submit" value="Odebírat" />
      </form>
    </div>
  </header>

  <main>
    <div class="filter-bar" id="filter-bar" hidden>
      <div class="filter-row">
        <label for="news-filter" style="position:absolute;left:-9999px">Hledat v archivu</label>
        <input type="search" id="news-filter" placeholder="Hledat v archivu…" autocomplete="off" spellcheck="false">
        <button type="button" class="filter-clear" id="filter-clear" aria-label="Vymazat filtr">×</button>
      </div>
      <p class="filter-meta" id="filter-meta"></p>
    </div>
    <div id="content">
      <p class="empty">Načítám archiv…</p>
    </div>
  </main>

  <footer>
    Data z arXiv + RSS · Aktualizace každý den ve 22:00 · Historie se uchovává
  </footer>

  <script>
    const MONTH_NAMES = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];

    function getMonthKey(date) {
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
    }

    function monthLabel(key) {
      const [y, m] = key.split('-').map(Number);
      return MONTH_NAMES[m - 1] + ' ' + y;
    }

    function fold(text) {
      return (text || '')
        .toString()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function itemText(item) {
      return fold([item.title, item.summary, item.source].join(' '));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function renderPost(item) {
      const inserted = new Date(item.inserted_at).toLocaleString('cs-CZ', { timeZone: 'Europe/Prague' });
      const published = item.published ? new Date(item.published).toLocaleDateString('cs-CZ') : '';
      return `
        <article class="post">
          <h2>${escapeHtml(item.title)}</h2>
          <div class="meta">
            Vloženo: ${inserted} · Zdroj: ${escapeHtml(item.source)} ${published ? '· Publikováno: ' + published : ''}
          </div>
          <p class="summary">${escapeHtml(item.summary)}</p>
          <a href="${item.url}" target="_blank" rel="noopener">Původní zdroj →</a>
        </article>`;
    }

    function queryFromUrl() {
      try {
        return new URLSearchParams(location.search).get('q') || '';
      } catch {
        return '';
      }
    }

    function writeQuery(q) {
      const url = new URL(location.href);
      if (q) url.searchParams.set('q', q);
      else url.searchParams.delete('q');
      history.replaceState(null, '', url);
    }

    let allOlder = [];

    function applyFilter() {
      const input = document.getElementById('news-filter');
      const clearBtn = document.getElementById('filter-clear');
      const meta = document.getElementById('filter-meta');
      const content = document.getElementById('content');
      const q = (input.value || '').trim();
      const needle = fold(q);
      clearBtn.style.display = q ? 'inline-flex' : 'none';
      writeQuery(q);

      const matched = needle
        ? allOlder.filter(item => itemText(item).includes(needle))
        : allOlder;

      if (matched.length === 0) {
        content.innerHTML = `
          <p class="empty">Nic se nenašlo pro „${escapeHtml(q)}“.<br>
          <a href="#" id="clear-empty">Vymazat filtr</a></p>`;
        meta.textContent = '0 z ' + allOlder.length;
        const link = document.getElementById('clear-empty');
        if (link) link.addEventListener('click', (e) => {
          e.preventDefault();
          input.value = '';
          applyFilter();
          input.focus();
        });
        return;
      }

      const groups = {};
      matched.forEach(item => {
        const d = new Date(item.inserted_at || item.published);
        const key = getMonthKey(d);
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });
      const orderedKeys = Object.keys(groups).sort().reverse();
      const byYear = {};
      orderedKeys.forEach(key => {
        const year = key.split('-')[0];
        if (!byYear[year]) byYear[year] = [];
        byYear[year].push(key);
      });

      let tocHtml = '<div class="toc"><h2>Rozcestník</h2>';
      Object.keys(byYear).sort().reverse().forEach(year => {
        tocHtml += `<div class="toc-year">${year}</div><div class="toc-months">`;
        byYear[year].forEach(key => {
          tocHtml += `<a href="#m-${key}">${monthLabel(key)} (${groups[key].length})</a>`;
        });
        tocHtml += '</div>';
      });
      tocHtml += '</div>';

      let bodyHtml = '';
      let currentYear = null;
      orderedKeys.forEach(key => {
        const year = key.split('-')[0];
        if (year !== currentYear) {
          currentYear = year;
          bodyHtml += `<h2 class="year-title">${year}</h2>`;
        }
        bodyHtml += `<h3 class="section-title" id="m-${key}">${monthLabel(key)}</h3>`;
        bodyHtml += groups[key].map(renderPost).join('');
      });

      content.innerHTML = tocHtml + bodyHtml + `
        <div class="back-top"><a href="#top">↑ Nahoru</a> · <a href="index.html">← Aktuální novinky</a></div>`;
      meta.textContent = needle
        ? matched.length + ' z ' + allOlder.length
        : allOlder.length + ' v archivu';
    }

    async function loadArchive() {
      const content = document.getElementById('content');
      try {
        const res = await fetch('data/news.json?' + Date.now());
        if (!res.ok) throw new Error('Soubor ještě neexistuje');
        const items = await res.json();

        if (!items || items.length === 0) {
          content.innerHTML = '<p class="empty">Archiv je zatím prázdný.</p>';
          return;
        }

        const now = new Date();
        const thisMonth = getMonthKey(now);
        const lastMonth = getMonthKey(new Date(now.getFullYear(), now.getMonth() - 1, 1));

        allOlder = items.filter(item => {
          const d = new Date(item.inserted_at || item.published);
          const key = getMonthKey(d);
          return key !== thisMonth && key !== lastMonth;
        });

        if (allOlder.length === 0) {
          content.innerHTML = `
            <p class="empty">Zatím žádné starší příspěvky. Archiv se začne plnit po uplynutí dvou měsíců.</p>
            <p style="text-align:center"><a href="index.html">← Zpět na aktuální novinky</a></p>`;
          return;
        }

        const bar = document.getElementById('filter-bar');
        const input = document.getElementById('news-filter');
        const clearBtn = document.getElementById('filter-clear');
        bar.hidden = false;
        bar.style.display = 'block';
        input.value = queryFromUrl();

        let timer = null;
        input.addEventListener('input', () => {
          clearTimeout(timer);
          timer = setTimeout(applyFilter, 150);
        });
        clearBtn.addEventListener('click', () => {
          input.value = '';
          applyFilter();
          input.focus();
        });

        applyFilter();
      } catch (e) {
        content.innerHTML = `<p class="empty">Nepodařilo se načíst data.<br><small>${escapeHtml(e.message)}</small></p>`;
      }
    }

    loadArchive();
  </script>
</body>
</html>
