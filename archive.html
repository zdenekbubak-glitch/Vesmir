<!DOCTYPE html>
<html lang="cs">
  <!-- Počítání zobrazení bez cookies a identifikace návštěvníků -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archiv – Kosmologické novinky</title>
  <style>
    :root { 
      --bg: #0b0f19; 
      --card: #151b2d; 
      --text: #e8eef7; 
      --accent: #6ea8fe; 
      --muted: #9aa8c7; 
    }
    * { box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 0; 
      line-height: 1.55; 
    }
    header { 
      background: linear-gradient(135deg, #0f172a, #1e293b); 
      padding: 1.8rem 1rem 1.5rem; 
      text-align: center; 
      border-bottom: 1px solid #1e293b; 
    }
    .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .logo-wrapper img {
      height: 48px;
      width: auto;
      display: block;
    }
    .logo-text h1 {
      margin: 0;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .subtitle { 
      color: var(--muted); 
      font-size: 0.95rem; 
      margin: 0.35rem 0 1rem; 
    }
    nav { 
      margin: 0.6rem 0 1.2rem; 
    }
    nav a { 
      color: var(--accent); 
      margin: 0 0.7rem; 
      font-size: 0.95rem; 
    }
    .signup-box {
      max-width: 440px;
      margin: 0 auto;
      background: rgba(21, 27, 45, 0.75);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 0.95rem 1.15rem;
    }
    .signup-box p {
      margin: 0 0 0.65rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .signup-form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .signup-form input[type="email"] {
      flex: 1;
      min-width: 200px;
      padding: 0.55rem 0.85rem;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0b0f19;
      color: var(--text);
      font-size: 0.95rem;
    }
    .signup-form input[type="email"]::placeholder {
      color: #64748b;
    }
    .signup-form button {
      padding: 0.55rem 1.15rem;
      background: var(--accent);
      color: #0b0f19;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: filter 0.15s;
    }
    .signup-form button:hover {
      filter: brightness(1.12);
    }
    main { 
      max-width: 820px; 
      margin: 0 auto; 
      padding: 1.5rem 1rem 3rem; 
    }
    .section-title { 
      font-size: 1.15rem; 
      color: var(--muted); 
      margin: 2rem 0 0.8rem; 
      border-bottom: 1px solid #1e293b; 
      padding-bottom: 0.4rem; 
    }
    .year-title { 
      font-size: 1.4rem; 
      margin: 2.2rem 0 0.6rem; 
      color: var(--text); 
    }
    .post { 
      background: var(--card); 
      border-radius: 12px; 
      padding: 1.25rem 1.4rem; 
      margin-bottom: 1.2rem; 
      border: 1px solid #1e293b; 
    }
    .post h2 { 
      margin: 0 0 0.5rem; 
      font-size: 1.2rem; 
    }
    .meta { 
      font-size: 0.85rem; 
      color: var(--muted); 
      margin-bottom: 0.8rem; 
    }
    .summary { 
      margin: 0 0 0.9rem; 
    }
    a { 
      color: var(--accent); 
      text-decoration: none; 
    }
    a:hover { 
      text-decoration: underline; 
    }
    .empty { 
      text-align: center; 
      color: var(--muted); 
      padding: 3rem 1rem; 
    }
    footer { 
      text-align: center; 
      padding: 1.5rem; 
      color: var(--muted); 
      font-size: 0.85rem; 
    }
    .toc { 
      background: var(--card); 
      border-radius: 12px; 
      padding: 1.2rem 1.4rem; 
      margin-bottom: 1.5rem; 
      border: 1px solid #1e293b; 
    }
    .toc h2 { 
      margin: 0 0 0.8rem; 
      font-size: 1.1rem; 
    }
    .toc-year { 
      margin: 0.8rem 0 0.3rem; 
      font-weight: 600; 
    }
    .toc-months { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 0.5rem; 
      margin-bottom: 0.6rem; 
    }
    .toc-months a { 
      display: inline-block; 
      padding: 0.3rem 0.7rem; 
      background: #1e293b; 
      border-radius: 6px; 
      font-size: 0.9rem; 
    }
    .toc-months a:hover { 
      background: #334155; 
      text-decoration: none; 
    }
    .back-top { 
      text-align: center; 
      margin: 2rem 0; 
    }
    @media (max-width: 520px) {
      .logo-wrapper {
        flex-direction: column;
        gap: 0.45rem;
      }
      .logo-wrapper img {
        height: 42px;
      }
      .logo-text h1 {
        font-size: 1.45rem;
      }
    }
  </style>
  <script>
(() => {
  if (
    navigator.webdriver ||
    location.hostname !== "zdenekbubak-glitch.github.io" ||
    !location.pathname.startsWith("/Vesmir/")
  ) return;

  const body = JSON.stringify({
    site: "vesmir",
    id: crypto.randomUUID()
  });

  async function odeslat() {
    try {
      const response = await fetch(
        "https://ai-robotika-radar.zdenek-bubak.chatgpt.site/api/analytics/collect",
        {
          method: "POST",
          mode: "cors",
          credentials: "omit",
          headers: { "Content-Type": "application/json" },
          body,
          keepalive: true
        }
      );
      return response.ok;
    } catch {
      return false;
    }
  }

  odeslat().then(ok => {
    if (!ok) setTimeout(odeslat, 1500);
  });
})();
</script>
</head>
<body>
  <header>
    <div class="logo-wrapper">
      <img src="assets/logo-icon.jpg" alt="Kosmologické novinky" width="48" height="48">
      <div class="logo-text">
        <h1>Archiv kosmologických novinek</h1>
      </div>
    </div>
    <p class="subtitle">Starší příspěvky podle měsíců a let</p>
    
    <nav>
      <a href="index.html">← Aktuální novinky</a>
      <a href="archive.html">Archiv</a>
    </nav>

    <div class="signup-box">
      <p>Chceš dostávat týdenní přehled novinek emailem?</p>
      <form 
        action="https://buttondown.email/api/emails/embed-subscribe/TVUJ-USERNAME" 
        method="post" 
        target="popupwindow" 
        onsubmit="window.open('https://buttondown.email/TVUJ-USERNAME', 'popupwindow')" 
        class="signup-form"
      >
        <input type="email" name="email" placeholder="tvuj@email.cz" required>
        <input type="hidden" name="tag" value="vesmir">
        <button type="submit">Odebírat</button>
      </form>
    </div>
  </header>

  <main id="archive">
    <p class="empty">Načítám archiv…</p>
  </main>

  <footer>
    Data z arXiv + RSS · Aktualizace každý den ve 22:00 · Historie se uchovává
  </footer>

  <script>
    // Zde zůstává původní logika načítání archivu.
    // Pokud máš v původním archive.html složitější JS pro TOC a seskupování,
    // zkopíruj ho sem zpět po nahrání tohoto souboru.
    // Pro teď je připravená struktura headeru + signup.
    
    document.getElementById('archive').innerHTML = '<p class="empty">Načítám archiv… (po nahrání doplň původní JS logiku archivu)</p>';
  </script>
</body>
</html>
