name: Denní kosmologické novinky

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Prague'   # 9:00 středoevropského času
  workflow_dispatch:              # možnost spustit ručně

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_and_update.py

      - name: Commit and push
        run: |
          git config user.name "cosmo-agent"
          git config user.email "agent@users.noreply.github.com"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Automatická aktualizace novinek $(date -u +%Y-%m-%d)"
          git push
